services:
  - type: web
    name: timexer-app
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    # Không tự deploy mỗi lần push: GitHub Actions chỉ gọi Deploy Hook khi CI xanh
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
